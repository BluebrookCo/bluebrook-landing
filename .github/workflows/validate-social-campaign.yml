name: Validate social campaign

on:
  pull_request:
    paths:
      - 'marketing/**'
      - 'scripts/render-nfl-2026-campaign.js'
      - 'scripts/schedule-nfl-2026-campaign.js'
      - 'scripts/schedule-nfl-2026-campaign.test.js'
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'scripts/render-nfl-2026-campaign.js'
      - 'scripts/schedule-nfl-2026-campaign.js'
      - 'scripts/schedule-nfl-2026-campaign.test.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Reject cross-league copy and artwork
        run: node --test scripts/schedule-nfl-2026-campaign.test.js
      - name: Validate complete campaign manifest
        run: node scripts/schedule-nfl-2026-campaign.js --action=preview
