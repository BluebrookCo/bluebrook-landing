name: Schedule future NFL campaign posts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witnessed-nfl-kickoff-scheduler
  cancel-in-progress: false

jobs:
  schedule-future-x-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out campaign source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Schedule missing future X posts
        env:
          WITNESSED_BUFFER_KEY: ${{ secrets.WITNESSED_BUFFER_KEY }}
        run: node scripts/schedule-nfl-2026-campaign.js --action=schedule --channel=twitter

      - name: Verify future X queue
        env:
          WITNESSED_BUFFER_KEY: ${{ secrets.WITNESSED_BUFFER_KEY }}
        run: node scripts/schedule-nfl-2026-campaign.js --action=queue-verify --channel=twitter
